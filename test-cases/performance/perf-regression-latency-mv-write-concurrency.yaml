test_duration: 680
prepare_write_cmd: ["scylla-bench -workload=sequential -mode=write -replication-factor=3 -partition-count=1000 -clustering-row-count=10000 -clustering-row-size=uniform:100..2048 -concurrency=500 -rows-per-request=10 -timeout=30s -connection-count 500  -consistency-level=all"]

n_db_nodes: 3
n_loaders: 1

instance_type_loader: 'c6i.xlarge'
instance_type_monitor: 't3.large'
instance_type_db: 'i4i.2xlarge'

user_prefix: 'perf-latency-mv-overloaded'
space_node_threshold: 644245094
ami_id_db_scylla_desc: 'VERSION_DESC'

round_robin: true
append_scylla_args: '--blocked-reactor-notify-ms 5 --abort-on-lsa-bad-alloc 1 --abort-on-seastar-bad-alloc --abort-on-internal-error 1 --abort-on-ebadf 1'
backtrace_decoding: false

store_perf_results: true
use_prepared_loaders: true
use_hdrhistogram: true
custom_es_index: 'mv-overloading-latency-write'

adaptive_timeout_store_metrics: false
